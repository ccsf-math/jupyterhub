[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsf-nbexporters"
version = "0.1.0"
description = "Custom nbconvert exporters for the CCSF JupyterHub image"
requires-python = ">=3.10"

[project.entry-points."nbconvert.exporters"]
html_embed = "ccsf_nbexporters:EmbeddedHTMLExporter"

[tool.setuptools]
packages = ["ccsf_nbexporters"]
